[package]
name = "jasmines"
default-run = "jasmines-xterm"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_14"] }
rand = "0.10.0"

[[bin]]
name = "jasmines-xterm"
path = "src/bin/tui/main.rs"

[[bin]]
name = "jasmines-gtk"
path = "src/bin/gtk/main.rs"
